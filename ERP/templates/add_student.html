<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Student</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 380px;
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    h3 {
      margin-top: 0;
      color: #4e73df;
      text-align: center;
      margin-bottom: 18px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 94%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.3s;
    }
     select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4e73df;
      box-shadow: 0 0 4px rgba(78, 115, 223, 0.3);
    }
    
     select:focus {
      border-color: #4e73df;
      box-shadow: 0 0 4px rgba(78, 115, 223, 0.3);
    }

    label {
      font-weight: 500;
      color: #444;
    }

    button {
      padding: 10px 12px;
      background: #4e73df;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #3b5fd8;
    }

    a {
      color: #1cc88a;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    p {
      text-align: center;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>👨‍🎓 Add Student</h3>
    <form method="post">
      <input name="name" placeholder="Full Name" required>
      <input name="roll_no" placeholder="Roll No" required>

      <label>Course:
        <select name="course_id" required>
          <option value="">--Select--</option>
          {% for c in courses %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Branch:
        <select name="branch_id" required>
          <option value="">--Select--</option>
          {% for b in branches %}
            <option value="{{ b.id }}">{{ b.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Section:
        <select name="section_id" required>
          <option value="">--Select--</option>
          {% for s in sections %}
            <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </label>

      <button type="submit">Add Student</button>
    </form>

    <p><a href="{{ url_for('teacher.dashboard') }}">⬅ Back to Dashboard</a></p>
  </div>
</body>
</html>
